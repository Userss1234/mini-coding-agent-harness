[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-coding-agent-harness"
version = "0.1.0"
description = "A lightweight coding-agent harness for repository maintenance experiments."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Liu Yusen" }]
dependencies = [
  "anthropic>=0.25.0",
  "mcp>=2.2,<3",
  "pywin32>=311; sys_platform == 'win32'",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=7.0.0",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]
retrieval = [
  "sentence-transformers>=2.2.2,<6.0",
  "transformers>=4.41,<4.42",
]

[project.scripts]
mini-agent = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
files = ["main.py", "harness"]
follow_imports = "skip"
ignore_missing_imports = true
incremental = false
show_error_codes = true
pretty = false

[tool.coverage.run]
branch = true
source = ["harness"]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true
