name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q main.py harness tests

      - name: Run unit tests
        run: python -m pytest

      - name: Run scripted benchmark
        run: |
          python main.py eval --mode scripted --output artifacts/EVAL.md --json-output artifacts/EVAL.json --trace-dir artifacts/eval_runs

      - name: Run retrieval quality baseline
        run: |
          python main.py retrieval-benchmark --output artifacts/RETRIEVAL_QUALITY_BASELINE.md --json-output artifacts/RETRIEVAL_QUALITY_BASELINE.json

      - name: Render trace HTML sample
        run: |
          python main.py trace-report --input artifacts/eval_runs/syntax_check.jsonl --output artifacts/TRACE.html

      - name: Run MCP smoke
        run: |
          python main.py --workspace . --trace artifacts/mcp_smoke_trace.jsonl mcp-smoke --output artifacts/MCP_SMOKE.md

      - name: Run MCP Streamable HTTP smoke
        run: |
          python main.py --workspace . --trace artifacts/mcp_http_smoke_trace.jsonl mcp-http-smoke --output artifacts/MCP_HTTP_SMOKE.md
          grep -F "Status: **pass**" artifacts/MCP_HTTP_SMOKE.md

      - name: Build Docker sandbox image
        run: |
          docker build --file docker/sandbox/Dockerfile --tag mini-coding-agent-harness-sandbox:latest .

      - name: Run Docker sandbox smoke
        run: |
          python main.py docker-smoke --output artifacts/DOCKER_SANDBOX_SMOKE.md
          grep -F "Status: **pass**" artifacts/DOCKER_SANDBOX_SMOKE.md

      - name: Upload validation artifacts
        uses: actions/upload-artifact@v6
        with:
          name: validation-artifacts
          path: artifacts/

  cross-feature:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Cache MiniLM model
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ runner.os }}-minilm-l6-v2-v1

      - name: Install base and retrieval dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[retrieval]"

      - name: Build Docker sandbox image
        run: |
          docker build --file docker/sandbox/Dockerfile --tag mini-coding-agent-harness-sandbox:latest .

      - name: Generate current Docker runtime evidence
        run: |
          python main.py docker-smoke --output artifacts/DOCKER_SANDBOX_SMOKE.md
          grep -F "Status: **pass**" artifacts/DOCKER_SANDBOX_SMOKE.md

      - name: Run Docker hybrid RAG MCP cross-feature validation
        run: |
          python main.py --workspace . --trace artifacts/cross_feature_trace.jsonl --fresh-trace cross-feature-smoke --allow-model-download --docker-report artifacts/DOCKER_SANDBOX_SMOKE.md --output artifacts/CROSS_FEATURE_VALIDATION.md
          grep -F "Status: **pass**" artifacts/CROSS_FEATURE_VALIDATION.md
          grep -F "local_chunk_hybrid_scoring" artifacts/CROSS_FEATURE_VALIDATION.md

      - name: Upload cross-feature evidence
        uses: actions/upload-artifact@v6
        with:
          name: cross-feature-validation
          path: artifacts/
